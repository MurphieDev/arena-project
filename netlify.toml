[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[functions."check-tips-scheduled"]
  schedule = "*/30 * * * *"
  node_bundler = "nft"
  external_node_modules = ["firebase-admin"]

[functions."trigger-tip-check"]
  node_bundler = "nft"
  external_node_modules = ["firebase-admin"]

[functions."ocr-proxy"]
  node_bundler = "nft"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
